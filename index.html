<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ Приглашение</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#FFE4C4,#FFD6E7);
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:420px;
border-radius:25px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.15);
text-align:center;
}

.cats{
display:flex;
justify-content:center;
gap:15px;
margin-bottom:20px;
}

.cats img{
width:90px;
height:90px;
}

h1{
color:#444;
margin-bottom:15px;
}

p{
color:#666;
line-height:1.6;
margin-bottom:20px;
}

label{
display:block;
text-align:left;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

input,select{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#f3f3f3;
font-size:16px;
}

button{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#ffb347;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#result{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

</style>
